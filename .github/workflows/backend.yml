name: ERP Beauty Pro Backend CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: system_peluqueria_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d system_peluqueria_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_VERSION: 1.0.0
      ENVIRONMENT: test
      DEBUG: false
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/system_peluqueria_test
      SECRET_KEY: ci-secret-key-only-for-automated-tests-32-characters
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validar dependencias instaladas
        run: python -m pip check

      - name: Auditar vulnerabilidades conocidas
        run: python -m pip_audit --requirement requirements.txt

      - name: Compilar aplicación y pruebas
        run: python -m compileall -q app tests

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Aplicar migraciones
        run: alembic upgrade head

      - name: Validar migraciones
        run: alembic check

      - name: Validar contrato OpenAPI
        run: >-
          python -c "from app.main import app;
          paths = app.openapi()['paths'];
          assert '/api/v1/salud' in paths;
          assert '/api/v1/auth/login' in paths;
          print(f'OpenAPI OK: {len(paths)} rutas')"

  container-build:
    needs: backend-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Construir imagen sin publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: erp-beauty-pro-backend:ci

  publish-container:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-validation, container-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generar etiquetas
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Publicar imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
